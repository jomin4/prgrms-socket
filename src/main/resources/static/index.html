<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실시간 채팅 — WebSocket(STOMP) 방식</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Pretendard Variable", Pretendard, sans-serif; }
  </style>
</head>
<body class="p-4">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

  <div id="root"></div>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from "https://esm.sh/react@19";
    import ReactDOMClient from "https://esm.sh/react-dom@19/client";
    import { throttle } from "https://esm.sh/lodash-es";

    const rootElement = ReactDOMClient.createRoot(document.getElementById("root"));

    // 연결은 앱 전체에 하나 (컴포넌트 바깥이라 딱 한 번만 실행됨)
    const socket = new SockJS("/ws");
    const stompClient = Stomp.over(socket);

    // 콜백 방식 connect 를 await 가능하게 감싼다
    const stompConnected = new Promise((resolve) => {
      stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);
        resolve();
      });
    });

    function App() {
      const [chatRoomId, setChatRoomId] = useState(2);
      const lastChatMessageId = useRef(0);
      const [chatRoom, setChatRoom] = useState();
      const [chatMessages, setChatMessages] = useState([]);

      const _loadMoreChatMessages = async () => {
        const response = await fetch(
          `/api/v1/chat/rooms/${chatRoomId}/messages?afterChatMessageId=${lastChatMessageId.current}`
        );

        const data = await response.json();

        if (data.length === 0) return;

        data.reverse();
        lastChatMessageId.current = data[0].id;
        setChatMessages((prevMessages) => [...data, ...prevMessages]);
      };

      // 300ms 마다 한 번씩만 실제로 실행 (쓰로틀링)
      const loadMoreChatMessages = useCallback(
        throttle(() => {
          _loadMoreChatMessages();
        }, 300),
        [chatRoomId]
      );

      useEffect(() => {
        // cleanup 이 await 보다 먼저 실행될 수 있으므로 미리 선언만 해둔다
        let sub1, sub2;

        // 방이 바뀌면 커서와 목록을 초기화
        lastChatMessageId.current = 0;
        setChatMessages([]);

        // 채팅방 정보 가져오기
        fetch(`/api/v1/chat/rooms/${chatRoomId}`)
                .then((response) => response.json())
                .then(setChatRoom);

        (async () => {
          // 기존 메시지를 다 그린 뒤에 입장 알림을 보낸다 (순서 보장)
          await _loadMoreChatMessages();

          // 연결이 완료될 때까지 대기 (두 번째부터는 즉시 통과)
          await stompConnected;

          sub1 = stompClient.subscribe(
                  `/topic/chat/room/${chatRoomId}/messageCreated`,
                  () => {
                    loadMoreChatMessages();
                  }
          );

          sub2 = stompClient.subscribe(
                  `/topic/chat/room/${chatRoomId}/systemMessageCreated`,
                  (message) => {
                    const newMessage = JSON.parse(message.body);
                    setChatMessages((prevMessages) => [newMessage, ...prevMessages]);
                  }
          );

          fetch(`/api/v1/chat/rooms/${chatRoomId}/messages/entry`, {
            method: "POST"
          });
        })();

        return () => {
          // 구독만 해제한다. 연결은 살려둔다.
          sub1?.unsubscribe();
          sub2?.unsubscribe();

          fetch(`/api/v1/chat/rooms/${chatRoomId}/messages/exit`, {
            method: "POST"
          });
        };
      }, [chatRoomId]);

      const onChatMessageFormSubmit = (e) => {
        e.preventDefault();

        const form = e.target;

        form.writerName.value = form.writerName.value.trim();

        if (form.writerName.value.length == 0) {
          alert("작성자를 입력해주세요.");
          form.writerName.focus();
          return;
        }

        form.content.value = form.content.value.trim();

        if (form.content.value.length == 0) {
          alert("메세지를 입력해주세요.");
          form.content.focus();
          return;
        }

        const writerName = form.writerName.value;
        const content = form.content.value;

        form.content.value = "";
        form.content.focus();

        fetch(`/api/v1/chat/rooms/${chatRoomId}/messages`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            writerName,
            content
          })
        })
          .then((response) => response.json())
          .then((data) => {
            console.log(`${data.id}번 메세지가 작성되었습니다.`);
          });
      };

      if (!chatRoom) return <>로딩중...</>;

      return (
        <>
          <div className="flex gap-2 mb-2">
            <button className="border p-2" onClick={() => setChatRoomId(1)}>
              1번 채팅방
            </button>
            <button className="border p-2" onClick={() => setChatRoomId(2)}>
              2번 채팅방
            </button>
            <button className="border p-2" onClick={() => setChatRoomId(3)}>
              3번 채팅방
            </button>
          </div>

          <h1 className="font-bold text-lg">
            채팅방(No {chatRoom.id} : {chatRoom.name})
          </h1>
          <div className="mt-2">개설날짜 : {dateForPrint(chatRoom.createDate)}</div>

          <hr className="my-2" />

          <h1 className="font-bold text-lg">채팅 메세지 작성</h1>

          <form className="flex gap-2" onSubmit={onChatMessageFormSubmit}>
            <input
              className="border p-2 w-20"
              type="text"
              placeholder="작성자"
              name="writerName"
              autoComplete="off"
            />
            <input
              className="border p-2"
              type="text"
              placeholder="메세지"
              name="content"
              autoComplete="off"
            />
            <input className="border p-2" type="submit" value="작성" />
          </form>

          <hr className="my-2" />

          <h1 className="font-bold text-lg">채팅 메세지</h1>

          <ul>
            {chatMessages.map((chatMessage) => (
              <li key={chatMessage.id}>
                {chatMessage.id}({dateForPrint(chatMessage.createDate)}) :{" "}
                {chatMessage.writerName} : {chatMessage.content}
              </li>
            ))}
          </ul>
        </>
      );
    }

    function dateForPrint(date) {
      return date.substring(2, 16).replaceAll("-", ".").replace("T", " ");
    }

    rootElement.render(<App />);
  </script>
</body>
</html>
